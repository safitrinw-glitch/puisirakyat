<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petualangan di Negeri Puisi Rakyat — MPI Kelas IX</title>
<style>
:root{--navy:#101b3c;--navy2:#1b2b58;--teal:#25b8a6;--gold:#f4c66a;--cream:#fff8e9;--ink:#20304e;--muted:#68758c;--violet:#8d75d6;--shadow:0 14px 35px #08132d35}
*{box-sizing:border-box}body{margin:0;font-family:Nunito,"Trebuchet MS",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 5%,#354d82 0,#17264d 38%,#0c1530 100%);min-height:100vh}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:11px 16px;font-weight:800;transition:.2s}button:hover{transform:translateY(-2px);filter:brightness(1.05)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:1180px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;color:white;gap:12px;margin-bottom:16px}.brand{font-weight:900;letter-spacing:.4px}.top small{color:#c8d4f1}.top-actions{display:flex;gap:8px}.ghost{background:#ffffff18;color:white;border:1px solid #ffffff35}.primary{background:linear-gradient(135deg,var(--gold),#ffe6a6);color:#3c2b12;box-shadow:0 7px 18px #0002}.secondary{background:var(--teal);color:#062e35}.light{background:#edf2fa;color:#273959}.danger{background:#ffe4e1;color:#8d2929}
.hero{position:relative;overflow:hidden;border:1px solid #ffffff35;border-radius:28px;padding:clamp(24px,5vw,58px);background:linear-gradient(120deg,#1d3765ed,#263c6be8 55%,#574c8adf);color:white;box-shadow:var(--shadow);min-height:300px}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(1px);pointer-events:none}.hero:before{width:270px;height:270px;background:#28c4b433;right:7%;top:-90px}.hero:after{width:190px;height:190px;background:#f4c66a33;right:25%;bottom:-110px}
.hero-content{position:relative;z-index:1;max-width:690px}.eyebrow{color:#ffe2a0;font-weight:900;letter-spacing:2px;text-transform:uppercase;font-size:.78rem}.hero h1{font-size:clamp(2rem,5vw,3.8rem);line-height:1.05;margin:12px 0}.hero p{font-size:1.08rem;color:#e3eafa;max-width:620px;line-height:1.65}.mascot{position:absolute;right:5%;bottom:5%;font-size:clamp(5rem,13vw,10rem);filter:drop-shadow(0 12px 12px #0006);transform:rotate(-7deg)}
.panel{background:var(--cream);border:1px solid #fff;border-radius:24px;padding:clamp(18px,3vw,30px);box-shadow:var(--shadow);margin-top:18px}.panel h2{margin:0 0 8px;color:#1a2c50}.muted{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:18px}.tile{background:linear-gradient(145deg,#fff,#edf4f6);border:1px solid #dce6ec;border-radius:20px;padding:18px;text-align:left;color:var(--ink);min-height:138px;box-shadow:0 7px 18px #152b4510}.tile .emoji{font-size:2rem;display:block;margin-bottom:8px}.tile strong{display:block;font-size:1.04rem}.tile small{color:var(--muted);display:block;margin-top:5px;line-height:1.4}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.field{display:grid;gap:6px;margin:12px 0}.field label{font-weight:800;font-size:.92rem}.field input,.field textarea,.field select{border:1px solid #cbd6e2;border-radius:12px;padding:12px;background:white;color:var(--ink);width:100%}.field textarea{min-height:90px;resize:vertical}
.progress{height:10px;background:#e3e9f0;border-radius:99px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#83d9be);width:0;transition:.3s}
.pill{display:inline-block;padding:5px 10px;border-radius:99px;background:#e5f5f1;color:#116457;font-size:.78rem;font-weight:900}.callout{background:#edf5f7;border-left:5px solid var(--teal);padding:14px 16px;border-radius:12px;line-height:1.6;margin:14px 0}.quote{background:#fff;border:1px dashed #d3b66d;border-radius:16px;padding:16px;font-family:Georgia,serif;font-size:1.12rem;line-height:1.8;text-align:center;margin:12px 0}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.mini{background:white;border:1px solid #e1e7ed;border-radius:16px;padding:15px}.mini h3{margin:0 0 8px;color:#24375b}.mini p,.mini li{line-height:1.55}.option{display:block;background:white;border:1px solid #d7e0e9;border-radius:12px;padding:12px;margin:8px 0;text-align:left;width:100%;color:var(--ink)}.option.selected{border:2px solid var(--teal);background:#eaf8f5}.option.correct{border:2px solid #24966f;background:#e9f8ef}.option.wrong{border:2px solid #cf6565;background:#fff0ef}.feedback{padding:12px;border-radius:12px;margin-top:10px;background:#edf5f7;line-height:1.5}.hidden{display:none!important}.navfoot{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}.small{font-size:.85rem}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden}th,td{padding:11px;border-bottom:1px solid #e7ebef;text-align:left;vertical-align:top}th{background:#eaf0f5}.bar{height:12px;border-radius:99px;background:#e8edf2;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}.badge{font-size:2rem}.dropzone{border:2px dashed #9db5c4;padding:12px;border-radius:14px;min-height:52px;background:#f8fbfc}.dragitem{display:inline-block;background:#e8effa;padding:9px 12px;border-radius:10px;margin:5px;cursor:grab}.footer{color:#bdc9e3;text-align:center;padding:22px;font-size:.82rem}
@media(max-width:650px){.app{padding:12px}.top{align-items:flex-start}.top-actions{flex-wrap:wrap;justify-content:flex-end}.mascot{opacity:.28;right:2%}.hero{min-height:280px}.navfoot button{flex:1}}
@media print{body{background:white}.top,.no-print,.footer{display:none!important}.panel{box-shadow:none;border:0}.certificate{border:8px double #c69a3a!important}}
</style></head>
<body><div class="app">
<header class="top"><div><div class="brand">📜 NEGERI PUISI RAKYAT</div><small>Media Pembelajaran Interaktif • Bahasa Indonesia IX</small></div><div class="top-actions"><button class="ghost" onclick="toggleAudio()" id="audioBtn">🔊 Audio</button><button class="ghost" onclick="go('home')">⌂ Beranda</button></div></header>
<main id="screen"></main><div class="footer">Belajar sastra • Berpikir kritis • Berkarya kreatif</div>
</div>
<script>
const sections=[
{id:'apersepsi',name:'Gerbang Misteri',icon:'🔮',desc:'Amati petunjuk dan bangun rasa ingin tahu.'},
{id:'awal',name:'Peta Pengetahuan',icon:'🧭',desc:'Kenali pemahaman awalmu.'},
{id:'materi',name:'Perpustakaan Sastra',icon:'📚',desc:'Jelajahi empat jenis puisi rakyat.'},
{id:'simulasi',name:'Laboratorium Puisi',icon:'🧪',desc:'Coba tantangan interaktif.'},
{id:'kuis',name:'Arena Tantangan',icon:'🏆',desc:'10 soal sedang dan sulit.'},
{id:'akhir',name:'Ujian Pujangga',icon:'🎓',desc:'Buktikan pemahamanmu.'},
{id:'refleksi',name:'Jurnal Penjelajah',icon:'✍️',desc:'Nilai proses belajarmu.'},
{id:'guru',name:'Ruang Guru',icon:'📊',desc:'Lihat rekap hasil belajar.'}
];
const questions=[
['Karmina umumnya terdiri atas ... dalam satu bait.',['Dua baris','Tiga baris','Empat baris','Enam baris'],0,'Karmina atau pantun kilat umumnya terdiri atas dua baris: sampiran dan isi.'],
['Dalam pantun, bagian isi terletak pada ...',['Baris pertama dan kedua','Baris kedua dan ketiga','Baris ketiga dan keempat','Semua baris'],2,'Pada pantun empat baris, baris pertama-kedua adalah sampiran dan baris ketiga-keempat adalah isi.'],
['Ciri yang paling membedakan syair dari pantun adalah ...',['Syair tidak memiliki isi','Semua baris syair merupakan isi','Syair selalu dua baris','Syair tidak memiliki rima'],1,'Syair tidak menggunakan sampiran; keempat barisnya merupakan isi.'],
['Puisi dua baris yang lazim menyampaikan nasihat dengan hubungan sebab-akibat disebut ...',['Pantun','Syair','Gurindam','Mantra'],2,'Gurindam terdiri atas dua baris yang saling berkaitan, sering berupa sebab dan akibat atau pernyataan dan penjelasan.'],
['Pola rima pantun yang umum adalah ...',['a-a-a-a','a-b-a-b','a-a-b-b','a-b-b-a'],1,'Pantun umumnya memiliki rima akhir a-b-a-b.'],
['Bacalah: “Jika ilmu rajin dicari / Hidup terarah masa berseri.” Bentuk ini paling tepat disebut gurindam karena ...',['Memiliki empat baris','Baris pertama dan kedua saling berhubungan sebagai nasihat','Memiliki sampiran','Semua baris membentuk cerita panjang'],1,'Dua barisnya saling berhubungan dan menyampaikan nasihat; bentuk tersebut sesuai dengan gurindam.'],
['Sebuah puisi terdiri atas empat baris, semua baris berisi gagasan, dan rimanya a-a-a-a. Jenis yang paling sesuai adalah ...',['Karmina','Pantun','Syair','Gurindam'],2,'Syair umumnya terdiri atas empat baris, seluruhnya isi, dan berpola rima a-a-a-a.'],
['Mengapa baris pertama dan kedua pantun disebut sampiran?',['Karena selalu berisi nasihat langsung','Karena menjadi pengantar bunyi dan gambaran menuju isi','Karena tidak boleh memiliki makna','Karena merupakan kesimpulan'],1,'Sampiran menjadi pengantar dan membangun keterkaitan bunyi atau gambaran dengan bagian isi.'],
['Seseorang menulis puisi empat baris dengan dua baris awal sebagai sampiran, dua baris akhir sebagai isi, dan rima a-b-a-b. Ia sedang menerapkan struktur ...',['Syair','Gurindam','Pantun','Karmina'],2,'Pembagian dua sampiran dan dua isi serta rima a-b-a-b merupakan ciri pantun.'],
['Penulis ingin menyampaikan cerita atau nasihat dalam beberapa bait; setiap bait empat baris, semua baris isi, dan berima a-a-a-a. Pilihan paling tepat adalah ...',['Syair','Karmina','Gurindam','Pantun'],0,'Syair sesuai karena tiap bait umumnya empat baris, semua baris isi, berima a-a-a-a, dan bait-baitnya dapat membentuk rangkaian cerita atau nasihat.']
];
let data=JSON.parse(localStorage.getItem('mpiPuisiIX')||'{}');
data.name=data.name||'';data.className=data.className||'IX';data.school=data.school||'';
data.scores=data.scores||{};data.answers=data.answers||{};data.reflection=data.reflection||{};
let currentQuiz=0,quizAnswers={},assessmentAnswers={},simDone={};
function save(){localStorage.setItem('mpiPuisiIX',JSON.stringify(data))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(id){if(!data.name&&id!=='home'){render();return}({home,apersepsi,awal,materi,simulasi,kuis,akhir,refleksi,guru,sertifikat})[id]?.()}
function render(){document.getElementById('screen').innerHTML=`<section class="hero"><div class="hero-content"><div class="eyebrow">Petualangan dimulai di sini</div><h1>Petualangan di<br>Negeri Puisi Rakyat</h1><p>Temukan rahasia karmina, pantun, syair, dan gurindam. Jelajahi perpustakaan sastra, selesaikan tantangan, lalu raih gelar Pujangga Muda!</p><button class="primary" onclick="document.getElementById('identitas').scrollIntoView({behavior:'smooth'})">✨ Mulai petualangan</button></div><div class="mascot">🧙‍♂️</div></section>
<section class="panel" id="identitas"><h2>👋 Kenalan dulu, Penjelajah!</h2><p class="muted">Isi identitas agar progres dan hasil belajarmu tersimpan di perangkat ini.</p><div class="two"><div class="field"><label>Nama siswa</label><input id="studentName" value="${esc(data.name)}" placeholder="Nama lengkap"></div><div class="field"><label>Kelas</label><input id="studentClass" value="${esc(data.className)}" placeholder="Contoh: IX-A"></div></div><div class="field"><label>Nama sekolah (opsional)</label><input id="school" value="${esc(data.school)}" placeholder="Nama sekolah"></div><button class="secondary" onclick="saveIdentity()">Simpan identitas</button><span class="small muted" id="identityMsg"></span></section>
<section class="panel"><div class="row between"><div><h2>🗺️ Peta petualangan</h2><p class="muted">Pilih menu mana pun. Kamu bebas menjelajah sesuai kebutuhan.</p></div><span class="pill">Progres tersimpan otomatis</span></div><div class="progress"><span style="width="${progress()}%"></span></div><div class="grid">${sections.map(s=>`<button class="tile" onclick="go('${s.id}')"><span class="emoji">${s.icon}</span><strong>${s.name}</strong><small>${s.desc}</small></button>`).join('')}</div></section>
<section class="panel"><h2>📈 Ringkasan belajarmu</h2><div class="two">${Object.entries(data.scores).map(([k,v])=>`<div class="mini"><strong>${label(k)}</strong><h2>${v}/100</h2></div>`).join('')||'<p class="muted">Belum ada nilai. Pilih menu untuk memulai.</p>'}</div><div class="row" style="margin-top:14px"><button class="light" onclick="go('sertifikat')">Lihat sertifikat</button><button class="light" onclick="go('guru')">Rekap untuk guru</button></div></section>`}
function saveIdentity(){let n=document.getElementById('studentName').value.trim();if(!n){alert('Nama siswa perlu diisi terlebih dahulu.');return}data.name=n;data.className=document.getElementById('studentClass').value.trim()||'IX';data.school=document.getElementById('school').value.trim();save();document.getElementById('identityMsg').textContent=' ✓ Identitas tersimpan.'}
function progress(){let done=['awal','kuis','akhir','refleksi'].filter(k=>data.scores[k]!==undefined).length;return Math.round(done/4*100)}
function label(k){return ({awal:'Asesmen awal',kuis:'Kuis',akhir:'Asesmen akhir'})[k]||k}
function shell(title,sub,body){document.getElementById('screen').innerHTML=`<section class="panel"><div class="row between"><div><span class="pill">NEGERI PUISI RAKYAT</span><h2 style="font-size:1.8rem;margin-top:10px">${title}</h2><p class="muted">${sub}</p></div><button class="light no-print" onclick="home()">⌂ Menu utama</button></div>${body}</section>`}
function home(){render()}
function apersepsi(){shell('🔮 Gerbang Misteri','Ayo amati petunjuk. Belum ada jawaban benar atau salah—gunakan rasa ingin tahumu!',`
<div class="hero" style="min-height:220px"><div class="hero-content"><div class="eyebrow">Naskah yang terlupakan</div><h1 style="font-size:2rem">Siapa yang meninggalkan pesan ini?</h1><p>Di perpustakaan tua, Pujangga menemukan empat potongan tulisan. Setiap potongan memiliki bunyi dan susunan yang berbeda. Ada pesan yang tersembunyi di baliknya...</p></div><div class="mascot">📜</div></div>
<div class="two"><div class="quote">Dahulu parang sekarang besi,<br>Dahulu sayang sekarang benci.</div><div class="quote">Pergi ke taman memetik melati,<br>Burung berkicau di pagi hari.<br>Jika ingin berbudi pekerti,<br>Hormati guru sepenuh hati.</div></div>
<div class="callout"><b>Renungkan:</b> Mengapa dua tulisan ini memiliki jumlah baris yang berbeda? Apakah semua puisi menyampaikan pesan dengan cara yang sama?</div>
<div class="field"><label>Pertanyaan yang muncul di benakmu</label><textarea id="wonder" placeholder="Aku penasaran mengapa ..."></textarea></div><button class="secondary" onclick="data.reflection.wonder=document.getElementById('wonder').value;save();alert('Rasa ingin tahumu tersimpan! Temukan petunjuknya di Perpustakaan Sastra.')">Simpan pertanyaanku</button><div class="navfoot"><button class="light" onclick="go('awal')">Lanjut ke asesmen awal →</button></div>`)}
function awal(){let qs=[['Puisi rakyat umumnya diwariskan melalui ...',['Tradisi lisan','Berita televisi','Laporan ilmiah','Iklan'],0],['Karmina umumnya memiliki ...',['2 baris','4 baris','6 baris','8 baris'],0],['Pantun biasanya memiliki pola rima ...',['a-a-a-a','a-b-a-b','a-a-b-b','bebas'],1],['Pada syair, bagian sampiran ...',['Selalu ada','Tidak digunakan','Berada di baris pertama','Berada di baris kedua'],1],['Gurindam umumnya berisi ...',['Petunjuk alat','Nasihat atau ajaran','Berita aktual','Dialog drama'],1]];
quizPage('awal','🧭 Peta Pengetahuan','Jawab sesuai pengetahuanmu saat ini. Hasil ini menjadi gambaran awal, bukan nilai akhir.',qs,'Simpan asesmen awal')}
function quizPage(key,title,desc,qs,submitText){let ans=data.answers[key]||{};let html=qs.map((q,i)=>`<div class="mini"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<label class="option"><input type="radio" name="${key}${i}" value="${j}" ${ans[i]==j?'checked':''}> ${String.fromCharCode(65+j)}. ${o}</label>`).join('')}</div>`).join('');shell(title,desc,`${html}<button class="primary" onclick="grade('${key}',${JSON.stringify(qs).replace(/"/g,'&quot;')})">${submitText}</button><div id="${key}Result"></div>`)}
function grade(key,qs){let a={};qs.forEach((q,i)=>{let el=document.querySelector(`input[name="${key}${i}"]:checked`);if(el)a[i]=+el.value});if(Object.keys(a).length<qs.length){alert('Jawab semua pertanyaan terlebih dahulu.');return}let score=Math.round(qs.reduce((s,q,i)=>s+(a[i]===q[2]?1:0),0)/qs.length*100);data.answers[key]=a;data.scores[key]=score;save();document.getElementById(key+'Result').innerHTML=`<div class="feedback"><b>Hasil: ${score}/100</b><p>${score>=80?'Hebat! Pemahaman awalmu sudah kuat.':score>=60?'Kamu sudah memiliki bekal awal. Mari perdalam materi.':'Tidak apa-apa. Ini titik awal untuk belajar.'}</p></div>`}
function materi(){shell('📚 Perpustakaan Sastra','Pilih buku untuk mempelajari pengertian, ciri, contoh, dan analisis. Tekan tombol dengarkan untuk audio narasi.',`
<div class="grid">
<button class="tile" onclick="topic('karmina')"><span class="emoji">📜</span><strong>Karmina</strong><small>Pantun kilat dua baris</small></button>
<button class="tile" onclick="topic('pantun')"><span class="emoji">🌺</span><strong>Pantun</strong><small>Sampiran, isi, dan rima</small></button>
<button class="tile" onclick="topic('syair')"><span class="emoji">🪶</span><strong>Syair</strong><small>Empat baris, semua isi</small></button>
<button class="tile" onclick="topic('gurindam')"><span class="emoji">🏮</span><strong>Gurindam</strong><small>Dua baris berisi nasihat</small></button></div>
<div id="topicContent" class="mini" style="margin-top:18px"><h3>🌟 Peta konsep puisi rakyat</h3><p>Puisi rakyat adalah karya sastra lama yang berkembang di masyarakat dan diwariskan turun-temurun, terutama secara lisan. Bentuknya memiliki aturan tertentu pada jumlah baris, rima, dan isi.</p><div class="tablewrap"><table><tr><th>Jenis</th><th>Baris/bait</th><th>Struktur isi</th><th>Rima umum</th></tr><tr><td>Karmina</td><td>2</td><td>Sampiran + isi</td><td>a-a</td></tr><tr><td>Pantun</td><td>4</td><td>2 sampiran + 2 isi</td><td>a-b-a-b</td></tr><tr><td>Syair</td><td>4</td><td>Semua baris isi</td><td>a-a-a-a</td></tr><tr><td>Gurindam</td><td>2</td><td>Dua baris saling berkaitan</td><td>a-a</td></tr></table></div><div class="callout"><b>Ingat:</b> Ciri di atas merupakan bentuk umum yang dipelajari. Perhatikan juga isi, hubungan ant baris, dan konteks puisi.</div></div>`)}
const topics={
karmina:{title:'Karmina',def:'Karmina adalah puisi rakyat lama yang dikenal sebagai pantun kilat. Bentuk umumnya singkat, terdiri atas dua baris dalam satu bait.',traits:['Terdiri atas dua baris.','Baris pertama merupakan sampiran dan baris kedua merupakan isi.','Umumnya memiliki rima akhir a-a.','Isinya dapat berupa sindiran, nasihat, atau ungkapan.'],poem:'Dahulu parang sekarang besi,<br>Dahulu sayang sekarang benci.',analysis:'Baris pertama berfungsi sebagai sampiran, baris kedua sebagai isi. Bunyi akhir “besi” dan “benci” membentuk persajakan yang berdekatan.',audio:'Karmina adalah pantun kilat yang umumnya terdiri atas dua baris. Baris pertama merupakan sampiran dan baris kedua merupakan isi. Karmina sering menyampaikan sindiran atau nasihat secara singkat.'},
pantun:{title:'Pantun',def:'Pantun adalah puisi rakyat yang umumnya terdiri atas empat baris dalam satu bait, dengan sampiran dan isi.',traits:['Umumnya terdiri atas empat baris.','Baris pertama dan kedua merupakan sampiran.','Baris ketiga dan keempat merupakan isi.','Umumnya setiap baris terdiri atas 8 sampai 12 suku kata.','Memiliki pola rima a-b-a-b.'],poem:'Pergi ke taman memetik melati,<br>Melihat kupu-kupu terbang ke awan.<br>Jika ingin menjadi pribadi berbudi,<br>Hormati guru dan sayangi kawan.',analysis:'Baris 1–2 adalah sampiran. Baris 3–4 adalah isi yang menyampaikan nasihat. Perhatikan persamaan bunyi akhir pada baris 1 dengan 3, serta 2 dengan 4.',audio:'Pantun umumnya terdiri atas empat baris. Dua baris pertama adalah sampiran, sedangkan dua baris berikutnya merupakan isi. Pola rimanya biasanya a-b-a-b.'},
syair:{title:'Syair',def:'Syair merupakan puisi rakyat dari tradisi sastra Melayu. Syair digunakan untuk menyampaikan cerita, nasihat, ajaran, atau pengalaman.',traits:['Umumnya terdiri atas empat baris dalam satu bait.','Semua baris merupakan isi, bukan sampiran.','Umumnya memiliki rima a-a-a-a.','Antarbait dapat membentuk rangkaian cerita atau gagasan.','Bahasanya cenderung puitis dan bermakna.'],poem:'Wahai kawan dengarlah pesan,<br>Rajin belajar janganlah bosan,<br>Ilmu dicari sepanjang zaman,<br>Menjadi bekal masa depan.',analysis:'Keempat baris menyampaikan isi berupa ajakan belajar. Bunyi akhir setiap baris membentuk pola a-a-a-a.',audio:'Syair umumnya terdiri atas empat baris dan semua barisnya merupakan isi. Syair memiliki rima a-a-a-a dan bait-baitnya dapat membentuk cerita atau nasihat.'},
gurindam:{title:'Gurindam',def:'Gurindam adalah puisi rakyat lama yang umumnya terdiri atas dua baris dalam satu bait dan berisi nasihat atau ajaran kehidupan.',traits:['Terdiri atas dua baris dalam satu bait.','Umumnya memiliki rima akhir a-a.','Kedua baris saling berhubungan makna.','Baris pertama sering menyatakan syarat, sebab, atau persoalan.','Baris kedua berisi akibat, jawaban, atau penjelasan.'],poem:'Jika ilmu rajin dicari,<br>Hidup terarah masa berseri.',analysis:'Baris pertama menyatakan tindakan atau kondisi, sedangkan baris kedua menyatakan hasil. Keduanya membentuk satu nasihat.',audio:'Gurindam terdiri atas dua baris yang saling berhubungan. Baris pertama sering menyatakan sebab atau syarat, dan baris kedua menyatakan akibat atau penjelasan. Gurindam biasanya berisi nasihat.'}
};
function topic(k){let t=topics[k];document.getElementById('topicContent').innerHTML=`<span class="pill">${t.title}</span><h2>${t.title}</h2><p>${t.def}</p><h3>Ciri-ciri</h3><ul>${t.traits.map(x=>`<li>${x}</li>`).join('')}</ul><h3>Contoh</h3><div class="quote">${t.poem}</div><h3>Analisis</h3><div class="callout">${t.analysis}</div><button class="secondary" onclick="speak(${JSON.stringify(t.audio)})">🔊 Dengarkan narasi</button> <button class="light" onclick="topic('')">Kembali ke peta konsep</button>`}
function simulasi(){shell('🧪 Laboratorium Puisi','Selesaikan latihan klasifikasi dan struktur. Jawaban langsung diperiksa.',`
<div class="mini"><h3>Tantangan 1 — Detektif jenis puisi</h3><p>“Empat baris, semua baris isi, rima a-a-a-a.” Jenis apakah ini?</p><div class="row"><button class="light" onclick="simCheck('s1','Pantun')">Pantun</button><button class="light" onclick="simCheck('s1','Syair')">Syair</button><button class="light" onclick="simCheck('s1','Gurindam')">Gurindam</button></div><div id="s1" class="feedback hidden"></div></div>
<div class="mini" style="margin-top:14px"><h3>Tantangan 2 — Kenali bagian pantun</h3><p>Seret label ke kategori yang tepat, atau klik label lalu pilih kategori.</p><div class="row"><button class="light" onclick="assign('sampiran')">Sampiran</button><button class="light" onclick="assign('isi')">Isi</button></div><div id="assignMsg" class="feedback">Pilih label, lalu klik salah satu kategori di bawah.</div><div class="two"><button class="option" onclick="checkAssign('sampiran')">Baris 1 dan 2</button><button class="option" onclick="checkAssign('isi')">Baris 3 dan 4</button></div></div>
<div class="mini" style="margin-top:14px"><h3>Tantangan 3 — Pasangkan konsep</h3><p>Pilih pasangan jenis puisi dengan cirinya.</p><select id="pairType" class="field"><option value="">Pilih jenis puisi</option><option>Karmina</option><option>Pantun</option><option>Syair</option><option>Gurindam</option></select><select id="pairFeature" class="field"><option value="">Pilih ciri</option><option value="2line">Dua baris, sampiran lalu isi</option><option value="4rhyme">Empat baris, semua isi, rima a-a-a-a</option><option value="abab">Empat baris, dua sampiran dan dua isi</option><option value="cause">Dua baris saling berkaitan sebagai nasihat</option></select><button class="secondary" onclick="checkPair()">Periksa pasangan</button><div id="pairMsg" class="feedback hidden"></div></div>
<div class="callout"><b>Target:</b> Selesaikan ketiga tantangan dan catat bagian yang masih perlu kamu pelajari.</div>`)}
let selectedAssign='';
function simCheck(id,val){let ok=val==='Syair';let e=document.getElementById(id);e.classList.remove('hidden');e.innerHTML=ok?'✅ Tepat! Syair memiliki empat baris, semua isi, dan rima a-a-a-a.':'Belum tepat. Ingat: semua baris merupakan isi dan rimanya a-a-a-a.';simDone.s1=ok;save()}
function assign(v){selectedAssign=v;document.getElementById('assignMsg').textContent='Label dipilih: '+(v==='isi'?'Isi':'Sampiran')+'. Sekarang pilih kelompok baris.'}
function checkAssign(v){let ok=selectedAssign===v;document.getElementById('assignMsg').textContent=ok?'✅ Benar!':'Belum tepat. Coba pikirkan kembali struktur pantun.';simDone.s2=ok;save()}
function checkPair(){let a=document.getElementById('pairType').value,b=document.getElementById('pairFeature').value;let map={Karmina:'2line',Pantun:'abab',Syair:'4rhyme',Gurindam:'cause'};let ok=map[a]===b;let e=document.getElementById('pairMsg');e.classList.remove('hidden');e.textContent=ok?'✅ Pasangan tepat!':'Belum cocok. Baca kembali tabel perbandingan.';simDone.s3=ok;save()}
function kuis(){currentQuiz=0;quizAnswers={};showQuiz()}
function showQuiz(){let q=questions[currentQuiz];shell('🏆 Arena Tantangan',`Soal ${currentQuiz+1} dari 10 • ${currentQuiz<5?'Kategori sedang':'Kategori sulit'}`,`<div class="progress"><span style="width:${(currentQuiz+1)*10}%"></span></div><div class="mini"><span class="pill">${currentQuiz<5?'SEDANG':'SULIT'}</span><h3>${currentQuiz+1}. ${q[0]}</h3>${q[1].map((o,i)=>`<button class="option ${quizAnswers[currentQuiz]===i?'selected':''}" onclick="chooseQ(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}<div id="qFeedback"></div></div><div class="navfoot"><button class="light" onclick="prevQ()" ${currentQuiz===0?'disabled':''}>← Sebelumnya</button><button class="primary" onclick="nextQ()">${currentQuiz===9?'Selesaikan kuis':'Berikutnya →'}</button></div>`)}
function chooseQ(i){quizAnswers[currentQuiz]=i;showQuiz()}
function prevQ(){if(currentQuiz>0){currentQuiz--;showQuiz()}}
function nextQ(){if(quizAnswers[currentQuiz]===undefined){alert('Pilih satu jawaban dahulu.');return}if(currentQuiz<9){currentQuiz++;showQuiz()}else finishQuiz()}
function finishQuiz(){let correct=0;questions.forEach((q,i)=>{if(quizAnswers[i]===q[2])correct++});let score=correct*10;data.scores.kuis=score;data.answers.kuis=quizAnswers;save();shell('🏆 Hasil Arena Tantangan',`Kuis selesai, ${esc(data.name)}!`,`<div style="text-align:center;padding:20px"><div class="badge">🏅</div><h1 style="font-size:3rem;color:#1a6b60">${score}/100</h1><p>${correct} dari 10 jawaban benar.</p><p>${score>=80?'Luar biasa! Kamu menguasai banyak konsep.':score>=60?'Bagus! Pelajari pembahasan untuk menguatkan pemahaman.':'Terus berlatih. Buka kembali Perpustakaan Sastra.'}</p></div>${questions.map((q,i)=>`<div class="mini"><b>${i+1}. ${q[0]}</b><p>Jawabanmu: ${q[1][quizAnswers[i]]||'—'}<br>Jawaban tepat: <b>${q[1][q[2]]}</b></p><div class="feedback">${q[3]}</div></div>`).join('')}<button class="primary" onclick="go('akhir')">Lanjut ke asesmen akhir →</button>`)}
function akhir(){let qs=[['Karmina umumnya terdiri atas ...',['Dua baris','Empat baris','Enam baris'],0],['Pada pantun, dua baris pertama disebut ...',['Isi','Sampiran','Amanat'],1],['Rima umum syair adalah ...',['a-b-a-b','a-a-a-a','a-a'],1],['Gurindam umumnya menyampaikan ...',['Nasihat dengan hubungan antardua baris','Cerita dengan sampiran','Dialog'],0],['Tuliskan satu perbedaan pantun dan syair.',['Pantun memiliki sampiran dan isi; syair semua barisnya isi.','Keduanya selalu dua baris.','Syair tidak memiliki rima.'],0]];
let aqs=qs.map((q,i)=>[q[0],q[1],q[2]]);let body=qs.map((q,i)=>`<div class="mini"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<label class="option"><input type="radio" name="end${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${o}</label>`).join('')}</div>`).join('')+`<div class="mini"><b>6. Buat satu bait puisi rakyat (pilih jenis dan tulis sesuai cirinya).</b><select id="createdType" class="field"><option>Karmina</option><option>Pantun</option><option>Syair</option><option>Gurindam</option></select><textarea id="createdPoem" placeholder="Tuliskan puisimu di sini..."></textarea><p class="small muted">Guru dapat menilai karya ini berdasarkan struktur, rima, isi, kreativitas, dan amanat.</p></div><button class="primary" onclick="gradeEnd()">Kirim asesmen akhir</button><div id="endResult"></div>`;shell('🎓 Ujian Pujangga','Asesmen akhir mengukur pemahaman setelah belajar. Jawab lima soal dan buat satu puisi.',body)}
function gradeEnd(){let qs=[['a',0],['b',1],['c',1],['d',0],['e',0]],correct=0;for(let i=0;i<5;i++){let e=document.querySelector(`input[name="end${i}"]:checked`);if(!e){alert('Jawab semua lima soal terlebih dahulu.');return}if(+e.value===qs[i][1])correct++}let poem=document.getElementById('createdPoem').value.trim();if(!poem){alert('Tuliskan puisimu terlebih dahulu.');return}let score=Math.round(correct/5*80+20);data.scores.akhir=score;data.answers.akhir={correct,poem,type:document.getElementById('createdType').value};save();document.getElementById('endResult').innerHTML=`<div class="feedback"><h3>Nilai sementara: ${score}/100</h3><p>Lima soal objektif menyumbang 80 poin; penyelesaian karya puisi memperoleh 20 poin partisipasi. Kualitas puisi tetap perlu ditinjau guru menggunakan rubrik.</p><button class="light" onclick="go('refleksi')">Lanjut refleksi →</button></div>`}
function refleksi(){shell('✍️ Jurnal Penjelajah','Luangkan waktu untuk menilai pemahaman, perasaan, dan rencana belajarmu.',`<div class="field"><label>1. Materi yang paling saya pahami</label><select id="r1"><option>Karmina</option><option>Pantun</option><option>Syair</option><option>Gurindam</option><option>Semua materi</option></select></div><div class="field"><label>2. Seberapa yakin kamu membedakan empat jenis puisi rakyat?</label><select id="r2"><option>Sangat yakin</option><option>Cukup yakin</option><option>Masih perlu latihan</option></select></div><div class="field"><label>3. Bagaimana perasaanmu selama pembelajaran?</label><select id="r3"><option>Senang dan tertarik</option><option>Tertantang</option><option>Biasa saja</option><option>Masih merasa kesulitan</option></select></div><div class="field"><label>4. Bagian yang paling menantang</label><textarea id="r4" placeholder="Ceritakan bagian yang masih membingungkan..."></textarea></div><div class="field"><label>5. Target saya berikutnya</label><textarea id="r5" placeholder="Contoh: berlatih membuat pantun dengan rima tepat..."></textarea></div><button class="primary" onclick="saveReflection()">Simpan refleksi</button><div id="refMsg"></div>`)}
function saveReflection(){data.reflection={understood:document.getElementById('r1').value,confidence:document.getElementById('r2').value,feeling:document.getElementById('r3').value,challenge:document.getElementById('r4').value,target:document.getElementById('r5').value};save();document.getElementById('refMsg').innerHTML='<div class="feedback">Refleksi tersimpan. Terima kasih sudah mengevaluasi proses belajarmu!</div>'}
function guru(){let scores=data.scores;let rows=['awal','kuis','akhir'].map(k=>`<tr><td>${label(k)}</td><td>${scores[k]===undefined?'Belum dikerjakan':scores[k]+'/100'}</td></tr>`).join('');shell('📊 Ruang Guru','Rekap ini tersimpan secara lokal di browser/perangkat yang digunakan siswa.',`<div class="mini"><h3>Identitas siswa</h3><p><b>Nama:</b> ${esc(data.name||'Belum diisi')}<br><b>Kelas:</b> ${esc(data.className)}<br><b>Sekolah:</b> ${esc(data.school||'—')}</p></div><div class="tablewrap" style="margin-top:14px"><table><tr><th>Komponen</th><th>Hasil</th></tr>${rows}</table></div><div class="mini" style="margin-top:14px"><h3>Refleksi siswa</h3><p><b>Materi dipahami:</b> ${esc(data.reflection.understood||'Belum diisi')}</p><p><b>Keyakinan:</b> ${esc(data.reflection.confidence||'—')}</p><p><b>Perasaan:</b> ${esc(data.reflection.feeling||'—')}</p><p><b>Tantangan:</b> ${esc(data.reflection.challenge||'—')}</p><p><b>Target:</b> ${esc(data.reflection.target||'—')}</p></div><div class="row" style="margin-top:14px"><button class="secondary" onclick="exportReport()">⬇ Unduh rekap CSV</button><button class="light" onclick="window.print()">🖨 Cetak rekap</button><button class="danger" onclick="resetData()">Reset data perangkat</button></div><p class="small muted">Catatan: rekap tidak dikirim ke server. Untuk mengumpulkan hasil kelas, siswa/guru dapat mengunduh CSV dari setiap perangkat lalu menggabungkannya.</p>`)}
function exportReport(){let r=[['Nama',data.name],['Kelas',data.className],['Sekolah',data.school],['Asesmen awal',data.scores.awal??''],['Kuis',data.scores.kuis??''],['Asesmen akhir',data.scores.akhir??''],['Materi dipahami',data.reflection.understood??''],['Perasaan',data.reflection.feeling??''],['Tantangan',data.reflection.challenge??''],['Target',data.reflection.target??'']];let csv=r.map(x=>x.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');download('rekap-puisi-rakyat.csv',csv,'text/csv')}
function sertifikat(){shell('🏅 Sertifikat Pujangga Muda','Sertifikat dapat dicetak atau disimpan sebagai PDF melalui dialog cetak browser.',`<div class="certificate" style="background:linear-gradient(145deg,#fffdf4,#f5e8c7);border:8px double #c69a3a;padding:30px;text-align:center;border-radius:12px;color:#293657"><div style="font-size:3rem">📜</div><div style="letter-spacing:3px;color:#98712a;font-weight:900">SERTIFIKAT PENCAPAIAN</div><h1 style="font-family:Georgia,serif;font-size:2.2rem">Pujangga Muda</h1><p>Dengan bangga diberikan kepada</p><h2 style="font-size:2rem;border-bottom:1px solid #c69a3a;display:inline-block;padding:8px 20px">${esc(data.name||'Nama Siswa')}</h2><p>atas partisipasi dalam petualangan pembelajaran<br><b>Puisi Rakyat — Bahasa Indonesia Kelas IX</b></p><p>Nilai kuis: <b>${data.scores.kuis??'—'}</b> &nbsp; • &nbsp; Asesmen akhir: <b>${data.scores.akhir??'—'}</b></p><p>${esc(data.school||'')}</p><div style="margin-top:28px;color:#98712a">✦ Terus membaca, berpikir, dan berkarya ✦</div></div><div class="row no-print" style="margin-top:16px"><button class="primary" onclick="window.print()">🖨 Cetak / Simpan PDF</button><button class="light" onclick="go('home')">Kembali</button></div>`)}
function resetData(){if(confirm('Hapus seluruh progres dan identitas yang tersimpan di perangkat ini?')){localStorage.removeItem('mpiPuisiIX');location.reload()}}
let audioOn=true;
function speak(text){if(!('speechSynthesis'in window)){alert('Fitur narasi suara tidak didukung browser ini.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='id-ID';u.rate=.92;u.pitch=1.05;speechSynthesis.speak(u)}
function toggleAudio(){audioOn=!audioOn;document.getElementById('audioBtn').textContent=audioOn?'🔊 Audio':'🔇 Audio';if(!audioOn&&'speechSynthesis'in window)speechSynthesis.cancel();else speak('Audio narasi aktif. Pilih materi dan tekan tombol dengarkan untuk mendengar penjelasan.')}
function download(name,content,type){let a=document.createElement('a');let blob=new Blob([content],{type});a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
render();
</script></body></html>
